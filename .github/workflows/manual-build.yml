name: Manual Build VRCT

on:
  workflow_dispatch:

jobs:
  build:
    name: Build And Upload Artifact
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Setup Python environment (CPU only)
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\pip install -r requirements.txt tqdm

      - name: Build and package
        shell: pwsh
        run: |
          npm run update-version
          npm run build-python
          npm run vite-build
          npm run tauri build
          .\.venv\Scripts\python utils/zip.py --zip_name VRCT.zip

      - name: Upload artifact (VRCT zip)
        uses: actions/upload-artifact@v4
        with:
          name: vrct-zip
          if-no-files-found: error
          path: ./VRCT.zip

      - name: Upload artifact (NSIS installer)
        uses: actions/upload-artifact@v4
        with:
          name: vrct-nsis-installer
          if-no-files-found: error
          path: ./src-tauri/target/release/bundle/nsis/*.exe
